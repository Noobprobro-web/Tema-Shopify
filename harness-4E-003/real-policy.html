<!doctype html>
<html class="no-js" lang="en" dir="ltr" data-animations="subtle">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terms of service</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="base.css">
<style>
      
      
      
      
      
      
      
      

      :root {
        --font-body-family: Assistant, sans-serif;
        --font-body-style: normal;
        --font-body-weight: 400;
        --font-heading-family: Libre Baskerville, serif;
        --font-heading-style: normal;
        --font-heading-weight: 400;
        --font-body-scale: 1;
        --font-heading-scale: 1.05;
        --page-width: 1300px;
        --page-gutter: 20px;
        --section-spacing: 72px;
        --button-radius: 0px;
      }.color-scheme-1 {
          --color-background: #F7F3EA;
          --gradient-background: #F7F3EA;
          --color-foreground: #1D1B18;
          --color-button: #1D1B18;
          --color-button-label: #FFFFFF;
          --color-link: #1D1B18;
          --color-border: #8F8574;
          --color-shadow: #1D1B18;
        }.color-scheme-2 {
          --color-background: #1D1B18;
          --gradient-background: #1D1B18;
          --color-foreground: #F8F4EB;
          --color-button: #D8A85D;
          --color-button-label: #1D1B18;
          --color-link: #F8F4EB;
          --color-border: #7A7061;
          --color-shadow: #000000;
        }.color-scheme-3 {
          --color-background: #EDE7DA;
          --gradient-background: #EDE7DA;
          --color-foreground: #1D1B18;
          --color-button: #1D1B18;
          --color-button-label: #FFFFFF;
          --color-link: #1D1B18;
          --color-border: #8A8070;
          --color-shadow: #1D1B18;
        }.color-scheme-4 {
          --color-background: #D8A85D;
          --gradient-background: #D8A85D;
          --color-foreground: #1D1B18;
          --color-button: #1D1B18;
          --color-button-label: #F7F3EA;
          --color-link: #1D1B18;
          --color-border: #6E5325;
          --color-shadow: #1D1B18;
        }.color-scheme-5 {
          --color-background: #FBF9F4;
          --gradient-background: #FBF9F4;
          --color-foreground: #2A2621;
          --color-button: #1D1B18;
          --color-button-label: #FFFFFF;
          --color-link: #2A2621;
          --color-border: #9A8F7C;
          --color-shadow: #1D1B18;
        }</style>
<script src="theme.js" defer="defer"></script>
<script>
document.documentElement.classList.remove('no-js');
document.documentElement.classList.add('js');
window.theme = window.theme || {};
window.theme.moneyFormat = '${{amount}}';
document.documentElement.dataset.moneyFormat = window.theme.moneyFormat;
</script>
</head>
<body class="template-page color-scheme-1">
<a class="skip-link" href="#MainContent">Skip to content</a>
<main id="MainContent" class="site-main" tabindex="-1">
<section class="section main-policy color-scheme-1" aria-labelledby="MainPolicyTitle-main">
  <div class="container container--narrow">
    <header class="main-policy__header flow"><h1 id="MainPolicyTitle-main" class="main-policy__title">Terms of service</h1></header>

    <div class="main-policy__layout"><anchor-nav
          class="main-policy__nav"
          data-anchor-source="#MainPolicyBody-main"
          data-anchor-selector="h2"
          data-anchor-prefix="MainPolicySection-main"
          hidden
        >
          <details class="anchor-nav__disclosure" data-anchor-disclosure open>
            <summary class="anchor-nav__summary">
              <span>On this page</span>
              <span class="faq-item__icon" aria-hidden="true"></span>
            </summary>
            <nav aria-label="On this page">
              <ol class="anchor-nav__list unstyled-list" data-anchor-list></ol>
            </nav>
          </details>
        </anchor-nav></div>
  </div>
</section>



</main>
</body></html>
