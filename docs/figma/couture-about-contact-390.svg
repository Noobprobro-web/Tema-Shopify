<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="5712" viewBox="0 0 390 5712" role="img" aria-labelledby="title desc">
  <title id="title">Atelier Flow Couture about and contact pages mobile</title>
  <desc id="desc">Two editable 390 pixel frames for the mobile atelier story and contact with frequently asked questions page.</desc>
  <defs>
    <style>
      .serif { font-family: "Playfair Display", "Times New Roman", serif; font-weight: 400; letter-spacing: 0; }
      .sans { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 400; letter-spacing: 0; }
      .paper { fill: #FAF8F5; }
      .surface { fill: #F3EFEA; }
      .subtle { fill: #EDE7DE; }
      .ink { fill: #1C1917; }
      .muted { fill: #605A53; }
      .accent { fill: #786C5E; }
      .white { fill: #FFFFFF; }
      .line { fill: none; stroke: #E5DFD5; stroke-width: 1; }
      .hairline { fill: none; stroke: #EDE7DE; stroke-width: 1; }
      .ink-line { fill: none; stroke: #1C1917; stroke-width: 1; }
      .muted-line { fill: none; stroke: #605A53; stroke-width: 1; }
      .eyebrow { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 1.2px; }
      .label { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0; }
      .body { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 400; letter-spacing: 0; }
      .reading { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif; font-size: 15px; font-weight: 400; letter-spacing: 0; }
      .small { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 400; letter-spacing: 0; }
      .micro { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 1.44px; }
      .hit { fill: #FFFFFF; fill-opacity: 0; }
    </style>
    <clipPath id="m-about-hero"><rect x="16" y="464" width="358" height="420"/></clipPath>
    <clipPath id="m-gallery-one"><rect x="16" y="1520" width="358" height="280"/></clipPath>
    <clipPath id="m-gallery-two"><rect x="16" y="1896" width="358" height="280"/></clipPath>
    <clipPath id="m-gallery-three"><rect x="16" y="2272" width="358" height="280"/></clipPath>
    <clipPath id="m-artisan-one"><rect x="32" y="2696" width="120" height="160"/></clipPath>
    <clipPath id="m-artisan-two"><rect x="32" y="2904" width="120" height="160"/></clipPath>
  </defs>

  <rect id="Canvas-Background" width="390" height="5712" class="subtle"/>

  <g id="Section-About-Atelier" aria-label="Atelier story page, mobile 390 by 3440">
    <rect width="390" height="3440" class="paper"/>

    <g id="About-Mobile-Header">
      <rect width="390" height="64" class="paper"/>
      <line x1="0" y1="63.5" x2="390" y2="63.5" stroke="#E5DFD5"/>
      <g aria-label="Open menu, 44 by 44"><rect x="8" y="10" width="44" height="44" class="hit"/><line x1="18" y1="27" x2="42" y2="27" stroke="#1C1917"/><line x1="18" y1="36" x2="36" y2="36" stroke="#1C1917"/></g>
      <text x="195" y="40" class="serif ink" font-size="20" text-anchor="middle">ATELIER FLOW</text>
      <g aria-label="Cart, 52 by 44"><rect x="330" y="10" width="52" height="44" class="hit"/><path d="M340 25 H358 L356 39 H343 Z" class="ink-line"/><text x="370" y="37" class="small ink">0</text></g>
    </g>

    <g id="About-Mobile-Manifesto">
      <text x="16" y="104" class="eyebrow muted">ATELIER FLOW / HERITAGE / EST. 2018</text>
      <text x="16" y="162" class="serif ink" font-size="42"><tspan x="16" dy="0">Made slowly,</tspan><tspan x="16" dy="46">kept closely.</tspan></text>
      <line x1="16" y1="241.5" x2="374" y2="241.5" stroke="#E5DFD5"/>
      <text x="16" y="278" class="reading ink"><tspan x="16" dy="0">We make physical things for a life lived</tspan><tspan x="16" dy="24">with attention. Each edition begins with</tspan><tspan x="16" dy="24">material, not trend.</tspan></text>
      <text x="16" y="370" class="body muted"><tspan x="16" dy="0">Small series in wool, leather, linen and clay.</tspan><tspan x="16" dy="20">Variation is recorded as evidence of process.</tspan></text>
      <g aria-label="Our material principles, 220 by 44"><rect x="16" y="404" width="220" height="44" class="hit"/><text x="16" y="432" class="label ink" text-decoration="underline">Our Material Principles</text></g>
    </g>

    <g id="About-Mobile-Hero-Media" clip-path="url(#m-about-hero)">
      <rect x="16" y="464" width="358" height="420" class="surface"/>
      <rect x="16" y="464" width="104" height="420" class="accent" opacity="0.62"/>
      <rect x="120" y="464" width="254" height="104" class="subtle"/>
      <rect x="120" y="568" width="254" height="316" class="muted" opacity="0.3"/>
      <path d="M108 804 H374 V884 H90 Z" class="accent"/>
      <path d="M144 804 L174 620 H294 L326 804 Z" class="ink"/>
      <rect x="190" y="648" width="88" height="136" class="surface"/>
      <path d="M206 760 C222 710 248 680 268 666 C258 724 248 758 226 784 Z" class="accent"/>
      <circle cx="326" cy="628" r="34" class="paper"/>
      <rect x="32" y="480" width="146" height="26" class="paper"/>
      <text x="105" y="498" class="micro ink" text-anchor="middle">WORKROOM / MORNING</text>
    </g>
    <rect x="16.5" y="464.5" width="357" height="419" class="hairline"/>

    <g id="About-Mobile-Philosophy">
      <rect x="16" y="920" width="358" height="516" class="surface"/>
      <g>
        <text x="32" y="958" class="eyebrow muted">01 / MATERIAL FIRST</text>
        <text x="32" y="998" class="serif ink" font-size="25">Let matter lead.</text>
        <text x="32" y="1034" class="body muted"><tspan x="32" dy="0">We begin with touch, weight and wear.</tspan><tspan x="32" dy="20">The silhouette follows what material can hold.</tspan></text>
      </g>
      <line x1="32" y1="1095.5" x2="358" y2="1095.5" stroke="#E5DFD5"/>
      <g>
        <text x="32" y="1134" class="eyebrow muted">02 / SMALL SERIES</text>
        <text x="32" y="1174" class="serif ink" font-size="25">Time is a tool.</text>
        <text x="32" y="1210" class="body muted"><tspan x="32" dy="0">Editions stay limited so attention remains</tspan><tspan x="32" dy="20">with every seam, glaze and finished edge.</tspan></text>
      </g>
      <line x1="32" y1="1271.5" x2="358" y2="1271.5" stroke="#E5DFD5"/>
      <g>
        <text x="32" y="1310" class="eyebrow muted">03 / LONG LIFE</text>
        <text x="32" y="1350" class="serif ink" font-size="25">Use leaves a record.</text>
        <text x="32" y="1386" class="body muted"><tspan x="32" dy="0">Patina and repair belong to each object.</tspan><tspan x="32" dy="21">Care guidance travels with each edition.</tspan></text>
      </g>
    </g>

    <g id="About-Mobile-Workshop-Gallery">
      <text x="16" y="1480" class="eyebrow muted">INSIDE THE ATELIER / PROCESS NOTES</text>

      <g id="Mobile-Gallery-Cutting">
        <g clip-path="url(#m-gallery-one)">
          <rect x="16" y="1520" width="358" height="280" class="ink"/>
          <rect x="16" y="1520" width="116" height="280" class="muted" opacity="0.55"/>
          <path d="M106 1744 L152 1580 H302 L354 1744 Z" class="surface"/>
          <path d="M152 1580 L216 1650 L302 1580" fill="none" stroke="#786C5E" stroke-width="2"/>
          <circle cx="70" cy="1600" r="30" class="paper"/>
          <path d="M50 1624 L62 1570 H80 L92 1624 Z" class="accent"/>
        </g>
        <rect x="16.5" y="1520.5" width="357" height="279" class="hairline"/>
        <text x="16" y="1828" class="micro muted">FIG. 01 / CUTTING TABLE</text>
        <text x="16" y="1854" class="small ink">Wool rests for twenty-four hours before cutting.</text>
      </g>

      <g id="Mobile-Gallery-Stitching">
        <g clip-path="url(#m-gallery-two)">
          <rect x="16" y="1896" width="358" height="280" class="accent"/>
          <rect x="16" y="1896" width="358" height="84" class="subtle" opacity="0.62"/>
          <circle cx="195" cy="2044" r="82" class="surface"/>
          <path d="M128 2090 C150 2020 184 1982 236 1972 C226 2042 210 2090 166 2148 Z" class="ink"/>
          <line x1="258" y1="2000" x2="186" y2="2148" stroke="#1C1917" stroke-width="3"/>
        </g>
        <rect x="16.5" y="1896.5" width="357" height="279" class="hairline"/>
        <text x="16" y="2204" class="micro muted">FIG. 02 / HAND FINISH</text>
        <text x="16" y="2230" class="small ink">A hidden stitch closes the edge without rigidity.</text>
      </g>

      <g id="Mobile-Gallery-Glazing">
        <g clip-path="url(#m-gallery-three)">
          <rect x="16" y="2272" width="358" height="280" class="surface"/>
          <rect x="16" y="2462" width="358" height="90" class="subtle"/>
          <ellipse cx="195" cy="2472" rx="94" ry="18" class="accent" opacity="0.42"/>
          <path d="M138 2456 C142 2372 160 2302 195 2288 C230 2302 248 2372 252 2456 Z" class="accent"/>
          <path d="M164 2400 C178 2368 212 2368 226 2400" fill="none" stroke="#FAF8F5" stroke-width="2"/>
        </g>
        <rect x="16.5" y="2272.5" width="357" height="279" class="hairline"/>
        <text x="16" y="2580" class="micro muted">FIG. 03 / GLAZE TEST</text>
        <text x="16" y="2606" class="small ink">Mineral washes are cataloged before firing.</text>
      </g>
    </g>

    <g id="About-Mobile-Artisans">
      <rect x="16" y="2648" width="358" height="464" class="surface"/>
      <g id="Mobile-Artisan-Elena">
        <g clip-path="url(#m-artisan-one)"><rect x="32" y="2696" width="120" height="160" class="subtle"/><circle cx="92" cy="2742" r="25" class="accent"/><path d="M52 2856 C56 2790 70 2766 92 2766 C116 2766 130 2790 134 2856 Z" class="ink"/></g>
        <text x="168" y="2718" class="eyebrow muted">TEXTILE ATELIER</text>
        <text x="168" y="2756" class="serif ink" font-size="23">Elena Rossi</text>
        <text x="168" y="2784" class="small ink"><tspan x="168" dy="0">Pattern cutter and</tspan><tspan x="168" dy="18">hand-finishing lead</tspan></text>
        <text x="168" y="2838" class="micro muted">12 YEARS / MILAN</text>
      </g>
      <line x1="32" y1="2879.5" x2="358" y2="2879.5" stroke="#E5DFD5"/>
      <g id="Mobile-Artisan-Noah">
        <g clip-path="url(#m-artisan-two)"><rect x="32" y="2904" width="120" height="160" class="subtle"/><circle cx="92" cy="2950" r="25" class="muted"/><path d="M52 3064 C56 2998 70 2974 92 2974 C116 2974 130 2998 134 3064 Z" class="accent"/></g>
        <text x="168" y="2926" class="eyebrow muted">OBJECT STUDIO</text>
        <text x="168" y="2964" class="serif ink" font-size="23">Noah Imani</text>
        <text x="168" y="2992" class="small ink"><tspan x="168" dy="0">Ceramicist and</tspan><tspan x="168" dy="18">surface researcher</tspan></text>
        <text x="168" y="3046" class="micro muted">09 YEARS / ROTTERDAM</text>
      </g>
    </g>

    <g id="About-Mobile-Signature">
      <text x="16" y="3164" class="eyebrow muted">A NOTE FROM THE STUDIO</text>
      <text x="16" y="3210" class="serif ink" font-size="28"><tspan x="16" dy="0">“We hope the work becomes</tspan><tspan x="16" dy="34">more yours with time.”</tspan></text>
      <text x="16" y="3298" class="small muted">Mara Vale and Theo Arden / Creative Directors</text>
      <g id="Explore-Archive-Button" aria-label="Explore our archive, 358 by 52"><rect x="16" y="3332" width="358" height="52" rx="2" class="accent"/><text x="195" y="3364" class="label white" text-anchor="middle">Explore Our Archive</text></g>
    </g>
  </g>

  <g id="Section-Contact-FAQ" transform="translate(0 3472)" aria-label="Contact and FAQ page, mobile 390 by 2240">
    <rect width="390" height="2240" class="paper"/>
    <g id="Contact-Mobile-Header">
      <rect width="390" height="64" class="paper"/>
      <line x1="0" y1="63.5" x2="390" y2="63.5" stroke="#E5DFD5"/>
      <g aria-label="Open menu, 44 by 44"><rect x="8" y="10" width="44" height="44" class="hit"/><line x1="18" y1="27" x2="42" y2="27" stroke="#1C1917"/><line x1="18" y1="36" x2="36" y2="36" stroke="#1C1917"/></g>
      <text x="195" y="40" class="serif ink" font-size="20" text-anchor="middle">ATELIER FLOW</text>
      <g aria-label="Cart, 52 by 44"><rect x="330" y="10" width="52" height="44" class="hit"/><path d="M340 25 H358 L356 39 H343 Z" class="ink-line"/><text x="370" y="37" class="small ink">0</text></g>
    </g>

    <g id="Contact-Mobile-Intro">
      <text x="16" y="104" class="eyebrow muted">CONTACT / PRIVATE CLIENT SERVICES</text>
      <text x="16" y="162" class="serif ink" font-size="39"><tspan x="16" dy="0">A considered</tspan><tspan x="16" dy="44">conversation.</tspan></text>
      <text x="16" y="260" class="body muted"><tspan x="16" dy="0">Write about an order, a material or a private</tspan><tspan x="16" dy="20">appointment. We reply within two business days.</tspan></text>
      <line x1="16" y1="311.5" x2="374" y2="311.5" stroke="#E5DFD5"/>
      <text x="16" y="350" class="eyebrow muted">STUDIO HOURS</text>
      <text x="16" y="380" class="body ink">Monday to Friday / 10:00–18:00 CET</text>
      <text x="16" y="424" class="eyebrow muted">SHOWROOM</text>
      <text x="16" y="454" class="body ink">By appointment / Via della Forma 18, Milan</text>
      <g aria-label="Book a showroom appointment, 260 by 44"><rect x="16" y="468" width="260" height="44" class="hit"/><text x="16" y="496" class="label ink" text-decoration="underline">Book a showroom appointment</text></g>
    </g>

    <g id="Contact-Mobile-Form" aria-label="Accessible mobile contact form">
      <text x="16" y="554" class="eyebrow muted">WRITE TO THE ATELIER</text>
      <text x="16" y="592" class="serif ink" font-size="27">Your inquiry</text>
      <g aria-label="Name field, 358 by 52"><text x="16" y="628" class="label ink">Name *</text><rect x="16" y="640" width="358" height="52" class="paper" stroke="#E5DFD5"/><text x="30" y="672" class="body muted">Your full name</text></g>
      <g aria-label="Email field, 358 by 52"><text x="16" y="728" class="label ink">Email *</text><rect x="16" y="740" width="358" height="52" class="paper" stroke="#E5DFD5"/><text x="30" y="772" class="body muted">name@example.com</text></g>
      <g aria-label="Inquiry reason select, 358 by 52"><text x="16" y="828" class="label ink">Reason for inquiry *</text><rect x="16" y="840" width="358" height="52" class="paper" stroke="#E5DFD5"/><text x="30" y="872" class="body ink">Order and delivery</text><path d="M350 860 L356 866 L362 860" class="ink-line"/></g>
      <g aria-label="Message field, 358 by 140"><text x="16" y="928" class="label ink">Message *</text><rect x="16" y="940" width="358" height="140" class="paper" stroke="#E5DFD5"/><text x="30" y="972" class="body muted">Include an order number when relevant.</text><text x="360" y="1064" class="micro muted" text-anchor="end">0 / 1000</text></g>
      <g aria-label="Privacy consent checkbox, 358 by 64"><rect x="16" y="1092" width="358" height="64" class="hit"/><rect x="16" y="1104" width="20" height="20" class="paper" stroke="#605A53"/><text x="48" y="1118" class="small ink"><tspan x="48" dy="0">I agree that my details may be used</tspan><tspan x="48" dy="18">to answer this inquiry.</tspan></text></g>
      <g aria-label="Send inquiry, 358 by 52"><rect x="16" y="1168" width="358" height="52" rx="2" class="accent"/><text x="195" y="1200" class="label white" text-anchor="middle">Send Inquiry</text></g>
      <text x="16" y="1248" class="small muted">Required fields are marked with an asterisk.</text>
    </g>

    <g id="Contact-Mobile-FAQ">
      <text x="16" y="1304" class="eyebrow muted">FREQUENTLY ASKED QUESTIONS</text>
      <text x="16" y="1342" class="serif ink" font-size="27">Before you write</text>
      <g id="Mobile-FAQ-Shipping">
        <g aria-label="Shipping and provenance expanded, 358 by 64"><rect x="16" y="1360" width="358" height="64" class="hit"/><text x="16" y="1400" class="body ink">Shipping and Provenance</text><path d="M350 1392 H370" class="ink-line"/></g>
        <line x1="16" y1="1423.5" x2="374" y2="1423.5" stroke="#E5DFD5"/>
        <rect x="16" y="1424" width="358" height="144" class="surface"/>
        <text x="32" y="1456" class="body muted"><tspan x="32" dy="0">Available pieces leave within three business</tspan><tspan x="32" dy="20">days. Made-to-order work includes a dated</tspan><tspan x="32" dy="20">provenance card and confirmed dispatch date.</tspan></text>
      </g>
      <g aria-label="Care and longevity collapsed, 358 by 64"><rect x="16" y="1568" width="358" height="64" class="hit"/><text x="16" y="1608" class="body ink">Care and Longevity</text><path d="M350 1600 H370 M360 1590 V1610" class="ink-line"/></g>
      <line x1="16" y1="1631.5" x2="374" y2="1631.5" stroke="#E5DFD5"/>
      <g aria-label="Returns and archive exchange collapsed, 358 by 64"><rect x="16" y="1632" width="358" height="64" class="hit"/><text x="16" y="1672" class="body ink">Returns and Archive Exchange</text><path d="M350 1664 H370 M360 1654 V1674" class="ink-line"/></g>
      <line x1="16" y1="1695.5" x2="374" y2="1695.5" stroke="#E5DFD5"/>
      <g aria-label="Bespoke orders collapsed, 358 by 64"><rect x="16" y="1696" width="358" height="64" class="hit"/><text x="16" y="1736" class="body ink">Bespoke Orders</text><path d="M350 1728 H370 M360 1718 V1738" class="ink-line"/></g>
      <line x1="16" y1="1759.5" x2="374" y2="1759.5" stroke="#E5DFD5"/>
      <g aria-label="Visit complete help center, 250 by 44"><rect x="16" y="1776" width="250" height="44" class="hit"/><text x="16" y="1804" class="label ink" text-decoration="underline">Visit the Complete Help Center</text></g>
    </g>

    <g id="Contact-Mobile-Services">
      <rect x="16" y="1848" width="358" height="312" class="ink"/>
      <text x="32" y="1888" class="eyebrow paper">DIRECT STUDIO CONTACTS</text>
      <g aria-label="Showroom appointments, 326 by 64"><rect x="32" y="1904" width="326" height="64" class="hit"/><text x="32" y="1932" class="label paper">Showroom appointments</text><text x="32" y="1954" class="small paper">Tuesday through Friday</text><path d="M338 1926 L350 1938 L338 1950" fill="none" stroke="#FAF8F5"/></g>
      <line x1="32" y1="1967.5" x2="358" y2="1967.5" stroke="#605A53"/>
      <g aria-label="Order concierge, 326 by 64"><rect x="32" y="1968" width="326" height="64" class="hit"/><text x="32" y="1996" class="label paper">Order concierge</text><text x="32" y="2018" class="small paper">+39 02 555 0188</text><path d="M338 1990 L350 2002 L338 2014" fill="none" stroke="#FAF8F5"/></g>
      <line x1="32" y1="2031.5" x2="358" y2="2031.5" stroke="#605A53"/>
      <g aria-label="Press and trade, 326 by 64"><rect x="32" y="2032" width="326" height="64" class="hit"/><text x="32" y="2060" class="label paper">Press and trade</text><text x="32" y="2082" class="small paper">studio@atelierflow.test</text><path d="M338 2054 L350 2066 L338 2078" fill="none" stroke="#FAF8F5"/></g>
      <text x="32" y="2134" class="micro paper">RESPONSE STANDARD / TWO BUSINESS DAYS</text>
    </g>

    <text x="16" y="2198" class="small muted"><tspan x="16" dy="0">Accessibility support is available in your</tspan><tspan x="16" dy="18">preferred contact format.</tspan></text>
  </g>
</svg>
