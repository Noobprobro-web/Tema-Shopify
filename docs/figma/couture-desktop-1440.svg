        <g id="Cart-Button-PDP" aria-label="Cart button, 76 by 44">
          <rect x="1332" y="14" width="76" height="44" class="hit"/>
          <text x="1340" y="42">BAG (0)</text>
        </g>
      </g>
    </g>

