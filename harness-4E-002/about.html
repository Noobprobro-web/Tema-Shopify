<!doctype html><html class="js no-js-removed" data-animations="subtle"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="base.css"></head>
<body>
  <section class="section main-about">
    <div class="container">
      <header class="main-about__header flow">
        <p class="eyebrow">Our story</p>
        <h1 class="main-about__title">About</h1>
      </header>
      <div class="main-about__blocks">
        <article class="main-about__story" style="--about-story-ratio: 21 / 9">
          <div class="main-about__story-media"><div class="main-about__placeholder" id="story-media" aria-hidden="true"></div></div>
          <div class="main-about__story-text flow" id="story-text">
            <h2 class="main-about__story-title">The atelier</h2>
            <div class="rte"><p>Tell the story of how the house began.</p></div>
          </div>
        </article>
        <figure class="main-about__quote" id="quote" style="margin-top:900px">
          <blockquote class="main-about__quote-text">A garment is finished when nothing else can be taken away.</blockquote>
          <figcaption class="main-about__quote-attribution"><span class="main-about__quote-name">Head of atelier</span></figcaption>
        </figure>
        <div class="main-about__values" style="margin-top:900px">
          <h2 class="main-about__values-title">What we hold to</h2>
          <ul class="main-about__values-grid unstyled-list">
            <li class="main-about__value" id="v1"><h3 class="main-about__value-title">Traceable fibres</h3></li>
            <li class="main-about__value" id="v2"><h3 class="main-about__value-title">Hand finished</h3></li>
            <li class="main-about__value" id="v3"><h3 class="main-about__value-title">Small series</h3></li>
          </ul>
        </div>
        <div class="main-about__gallery" style="margin-top:900px">
          <ul class="main-about__gallery-grid unstyled-list">
            <li class="main-about__gallery-item" id="g1"><div class="main-about__placeholder"></div></li>
            <li class="main-about__gallery-item" id="g2"><div class="main-about__placeholder"></div></li>
          </ul>
        </div>
      </div>
    </div>
  </section>
  <script src="theme.js"></script>
</body></html>
